; Start a new pool named 'www'.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
;listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
;listen.mode = 0660
pm = dynamic
; Debian 默认 5 个 child：一个页面占住 child 0.6-4 秒（时间基本都花在等远端
; MySQL，不占 CPU），浏览器同时开几个页面、或者几个 agent 一起抓就会排队。
; 提高到 10 只是「别让默认值拖后腿」，不是追求吞吐。
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
; 老代码有长生命周期对象/内存泄漏，跑够一批就回收，避免越跑越胖。
pm.max_requests = 500
clear_env = no
