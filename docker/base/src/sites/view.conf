#
# Main TKE Intranet Virtual Host (local environment)
# --------------------------------------
#
<VirtualHost 0.0.0.0:80>
    ServerName localhost
    DocumentRoot /opt/preview/web
    # 自动登录版 login.php 由镜像提供，用 Alias 生效：docroot 里的 web 是仓库的整目录软链，
    # 不能再塞文件进去（那样新增页面就要重建）。
    Alias /login.php /opt/preview/overrides/login.php
    <Directory />
        DirectoryIndex index.html index.php
        AllowOverride All
        Require all granted
    </Directory>
    Alias /vivid /opt/preview/vivid/public
    <Directory /vivid>
        DirectoryIndex index.html index.php
        AllowOverride All
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteOptions Inherit
    ExpiresActive On
    ExpiresDefault now
    <LocationMatch "^/v[0-9]+/">
        ExpiresDefault "now plus 7 days"
    </LocationMatch>
    <Location /img/>
        ExpiresDefault "now plus 7 days"
    </Location>
    RewriteRule ^/v[0-9]+/(.*) /$1
	  # 日志走 apache2 默认路径，entrypoint 里 tail 的就是这个文件（别改回 /var/log/error.log）
    <Directory "/opt/preview/web/marketquery">
      AllowOverride All
    </Directory>
    <Directory "/opt/preview/web/nimod">
      AllowOverride All
    </Directory>
    <Directory "/opt/preview/web/crm">
      AllowOverride All
    </Directory>
    <Directory "/opt/preview/web/oli_2">
          AllowOverride All
    </Directory>
    <Directory "/opt/preview/web/webportal">
      AllowOverride All
    </Directory>
    <Directory "/opt/preview/web/webportal2">
      AllowOverride All
    </Directory>
    <Directory "/opt/preview/web/standard_template">
      AllowOverride All
    </Directory>
    <Directory "/opt/preview/web/sharp">
      AllowOverride All
    </Directory>
	  <Directory "/opt/preview/web/NIWebportal">
      AllowOverride All
    </Directory>
</VirtualHost>
