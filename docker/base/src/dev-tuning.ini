; 本地开发镜像的运行时调优（FPM + CLI 共用）
;
; 原则：只调「容量」和「校验频率」，不加任何会让人看不到自己改动的缓存。
; 这两项都是默认值在开发场景下不合适，而不是额外加功能。

; ---- OPcache ----
; 仓库里 3.2 万个 .php（vivid/vendor/<版本> 有多份副本）。Debian/sury 默认
; max_accelerated_files=10000 装不下：命中率被反复淘汰拉低，缓存满了还会整体重置。
opcache.enable=1
opcache.memory_consumption=512
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=32531

; 默认 revalidate_freq=2 意味着「改完代码最多 2 秒内仍然执行旧字节码」。
; 开发镜像要的是「保存 → 刷新 → 立刻看到」，所以压到 0（每个请求校验时间戳）。
; 实测开/关这一项，PHP 页耗时没有可测量的差异（约 3ms 的页面上无区别）。
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.save_comments=1

; ---- realpath / stat 缓存 ----
; 默认 realpath_cache_ttl=120 秒：新增文件、切分支、重跑 /run/init.sh 重建
; /opt/preview 软链之后，最长 2 分钟仍按旧路径解析（表现为「新文件 include 不到」）。
realpath_cache_ttl=5
realpath_cache_size=4096k
