# =============================================================================
# nginx.conf — VIEW preview site on nginx + PHP-FPM
#
# 取代原来的 Apache 前端（src/httpd.conf + src/sites/view.conf 里的 .php handler、
# Alias、RewriteRule、mod_expires，以及 8 个模块目录的 .htaccess）。
# PHP-FPM 完全不变：127.0.0.1:9000，pool www（clear_env = no）。
#
# 由 docker/base/Dockerfile COPY 到 /etc/nginx/nginx.conf（构建期 nginx -t 校验）。
# Apache 侧的逐条对照、Apache 专属 $_SERVER 变量的补齐方式、以及已知差异，
# 都写在同目录的 README.md 里。
#
# 回滚：切回还带 apache2 的旧镜像 tag。
# =============================================================================
user  www-data;
# 本地开发容器：固定 4 个 worker 就够（auto 会按宿主机核数起，12 核机器上 12 个
# worker 白占 ~65MB 常驻内存；页面耗时也不在这层。要压测时再调大）。
worker_processes  4;
pid   /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
# Debian/Ubuntu dynamic modules (nginx-light). Keep the distro hook so a module
# added to the image later is still loaded.
include /etc/nginx/modules-enabled/*.conf;
events {
    worker_connections 1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log main;
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;
    # Debian package defaults for request buffering.
    client_body_temp_path /var/lib/nginx/body;
    proxy_temp_path       /var/lib/nginx/proxy;
    fastcgi_temp_path     /var/lib/nginx/fastcgi;
    uwsgi_temp_path       /var/lib/nginx/uwsgi;
    scgi_temp_path        /var/lib/nginx/scgi;
    # ---------------------------------------------------------------------
    # PHP-FPM upstream。keepalive 复用与 FPM 的连接：省掉每个请求的 loopback
    # 三次握手，也避免高并发时 TIME_WAIT 堆积（各 PHP location 里配合
    # `fastcgi_keep_conn on`）。
    # ---------------------------------------------------------------------
    upstream phpfpm {
        server 127.0.0.1:9000;
        keepalive 32;
    }
    # ---------------------------------------------------------------------
    # Apache 专属 $_SERVER 变量的等价件（View 老代码依赖它们，不改代码就得补）：
    #   SCRIPT_URL  43 处引用  -> 原始请求路径（不含 query）           ：$request_path
    #   SCRIPT_URI  39 处引用  -> scheme://host + 原始路径              ：$request_path
    #   REDIRECT_URL  3 处引用 -> 只在「目录级重写」时存在（见下）      ：$request_path
    #   SERVER_NAME / SERVER_PORT -> Apache 默认 UseCanonicalName Off，
    #                                跟随 Host 头（nginx 默认给 server_name/80）
    # REDIRECT_URL 的作用域必须和 Apache 一致：只给发生重写的 location
    # （8 个老模块 + @vivid），普通 .php 请求不给 —— 否则原本走 `?? PHP_SELF`
    # 回退的页面会变成路径匹配，菜单/权限分支会错位。
    # ---------------------------------------------------------------------
    map $http_host $request_port {
        ~.*:(?<port>\d+)$  $port;
        default            $server_port;
    }
    map $request_uri $request_path {
        ~^(?<p>[^?]*)  $p;
        default        $request_uri;
    }
    # ---------------------------------------------------------------------
    # gzip  <->  the AddOutputFilterByType DEFLATE lines in the module
    # .htaccess files (sharp, nimod/public, oli_2/public, ...).
    # Apache compresses text/html, text/plain, text/xml, text/css,
    # application/x-javascript and the gif/png/jpeg images. nginx has no
    # per-directory gzip, so the types are enabled for the whole server; that
    # is a superset of Apache's behaviour (documented as a difference).
    # ---------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types        text/plain text/xml text/css application/javascript
                      application/x-javascript image/gif image/png image/jpeg;
    # ---------------------------------------------------------------------
    # Apache `ExpiresActive On / ExpiresDefault now`:
    #   * default            -> Cache-Control: max-age=0
    #   * /v[0-9]+/...       -> 7 days   (<LocationMatch "^/v[0-9]+/">)
    #   * /img/...           -> 7 days   (<Location /img/>)
    # The map is evaluated on the ORIGINAL uri, before the /vN/ prefix is
    # stripped below, so versioned static assets keep their 7 days.
    # ---------------------------------------------------------------------
    # NOTE: keyed on $request_uri (original URL). $uri is rewritten by the
    # /vN/ strip below, which would lose the 7-day rule for versioned assets.
    map $request_uri $view_expires {
        default                 0;
        "~^/v[0-9]+/"           7d;
        "~^/img/"               7d;
    }
    # Apache `SetEnv APPLICATION_ENV development` comes from the module
    # .htaccess files. nginx has no per-directory env, so it is derived from
    # the URI; empty for everything outside those subtrees (Apache: unset).
    map $uri $view_app_env {
        default                                            "";
        "~^/sharp/"                                        "development";
        "~^/nimod/public/"                                 "development";
        "~^/oli_2/public/"                                 "development";
        "~^/poa/public/"                                   "development";
        "~^/webportal/public/"                             "development";
        "~^/NIWebportal/public/"                           "development";
        "~^/subconportal/public/"                          "development";
        "~^/servicesales/public/"                          "development";
    }
    # ---------------------------------------------------------------------
    # Every PHP location below includes /etc/nginx/fastcgi_params and adds:
    #   fastcgi_pass 127.0.0.1:9000   <- <FilesMatch \.php$> SetHandler proxy:fcgi
    #   HTTP_AUTHORIZATION            <- SetEnvIf Authorization .+ HTTP_AUTHORIZATION=$0
    #   DOCUMENT_ROOT                 <- $_SERVER['DOCUMENT_ROOT'] used by old pages
    # ---------------------------------------------------------------------
    server {
        listen       80;
        server_name  localhost;
        # Apache: DocumentRoot /opt/preview/web
        root  /opt/preview/web;
        # Apache: DirectoryIndex index.html index.php  (vhost <Directory />)
        index index.html index.php;
        charset utf-8;
        # PHP 响应常见 100-500KB（/common/myaccount.php 501KB），默认 8x4k 缓冲会
        # 落盘到 /var/lib/nginx/fastcgi 再读回；放大后基本不落盘。
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_read_timeout 120s;
        # Apache: no LimitRequestBody; the real cap is php.ini
        # (upload_max_filesize = post_max_size = 150M).
        # nginx defaults to 1m and would answer 413 for anything bigger.
        client_max_body_size 150m;
        # Never expose Apache-style dot-files (.htaccess/.htpasswd); Apache
        # denies them by default, nginx would happily serve them.
        location ~ /\.ht {
            deny all;
        }
        # -------------------------------------------------------------
        # Alias /login.php /opt/preview/overrides/login.php
        # (auto-login login page that lives outside the docroot)
        # -------------------------------------------------------------
        location = /login.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /opt/preview/overrides/login.php;
            fastcgi_param SCRIPT_NAME     /login.php;
            fastcgi_param DOCUMENT_ROOT   /opt/preview/web;
            fastcgi_param SCRIPT_URL      $request_path;
            fastcgi_param SCRIPT_URI      $scheme://$http_host$request_path;
            fastcgi_param PATH_INFO       "";
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTP_HOST           $http_host;
            fastcgi_param SERVER_NAME         $host;
            fastcgi_param SERVER_PORT         $request_port;
            fastcgi_param APPLICATION_ENV     $view_app_env;
            fastcgi_pass phpfpm;
            fastcgi_keep_conn on;
        }
        # -------------------------------------------------------------
        # Alias /vivid /opt/preview/vivid/public
        # Apache answers /vivid with 301 /vivid/ (mod_dir).
        # -------------------------------------------------------------
        location = /vivid {
            expires 0;
            return 301 /vivid/;
        }
        # Laravel front controller. `alias` keeps /vivid in the URL while the
        # code lives in /opt/preview/vivid/public; try_files $uri/$uri/ serves
        # the real static files (static, vendor, img, ...) and everything else
        # goes to index.php — same as vivid/public/.htaccess.
        location /vivid/ {
            alias /opt/preview/vivid/public/;
            index index.php;
            # NOTE: the fallback must be a named location, not a URI. Inside an
            # `alias` location nginx resolves a URI fallback against the alias
            # and answers 404 instead of running the front controller.
            try_files $uri $uri/ @vivid;
            expires $view_expires;
        }
        # Laravel front controller as a named location (see try_files above).
        location @vivid {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /opt/preview/vivid/public/index.php;
            fastcgi_param SCRIPT_NAME     /vivid/index.php;
            fastcgi_param DOCUMENT_ROOT   /opt/preview/web;
            fastcgi_param SCRIPT_URL      $request_path;
            fastcgi_param SCRIPT_URI      $scheme://$http_host$request_path;
            fastcgi_param PATH_INFO       "";
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTP_HOST           $http_host;
            fastcgi_param SERVER_NAME         $host;
            fastcgi_param SERVER_PORT         $request_port;
            fastcgi_param APPLICATION_ENV     $view_app_env;
            fastcgi_param REDIRECT_URL $request_path;
            fastcgi_pass phpfpm;
            fastcgi_keep_conn on;
        }
        # The one PHP file in vivid/public. SCRIPT_NAME must keep the /vivid
        # prefix because Laravel derives its base path from it (no
        # forceRootUrl in vivid/.env).
        location = /vivid/index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /opt/preview/vivid/public/index.php;
            fastcgi_param SCRIPT_NAME     /vivid/index.php;
            fastcgi_param DOCUMENT_ROOT   /opt/preview/web;
            fastcgi_param SCRIPT_URL      $request_path;
            fastcgi_param SCRIPT_URI      $scheme://$http_host$request_path;
            fastcgi_param PATH_INFO       "";
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTP_HOST           $http_host;
            fastcgi_param SERVER_NAME         $host;
            fastcgi_param SERVER_PORT         $request_port;
            fastcgi_param APPLICATION_ENV     $view_app_env;
            fastcgi_pass phpfpm;
            fastcgi_keep_conn on;
        }
        # -------------------------------------------------------------
        # RewriteRule ^/v[0-9]+/(.*) /$1
        # Strip the asset version prefix and continue location matching.
        # -------------------------------------------------------------
        rewrite ^/v[0-9]+/(.*)$ /$1 last;
        # -------------------------------------------------------------
        # Legacy Zend modules. Their .htaccess does, in practice:
        #   * existing file / symlink / directory   -> serve it
        #   * anything ending in gif|jpg|png|css|js -> serve it (404 if absent)
        #   * everything else                       -> /vivid/ (front controller,
        #                                              original REQUEST_URI kept)
        # sharp/.htaccess additionally sets
        #   ErrorDocument 404 /common/blankpage/404.php
        # -------------------------------------------------------------
        location ^~ /sharp/ {
            # Apache never serves .htaccess; ^~ bypasses the top-level dotfile
            # rule, so the deny is repeated inside every module location.
            location ~ /\.ht { deny all; }
            # Apache: a .php path under a legacy module that is not an existing
            # file is rewritten by the module .htaccess to /vivid/ (Laravel).
            # Without this block the top-level PHP location would answer 404.
            location ~ \.php($|/) {
                fastcgi_split_path_info ^(.+?\.php)(/.*)$;
                set $path_info $fastcgi_path_info;
                try_files $fastcgi_script_name /vivid/index.php?$query_string;
                include /etc/nginx/fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param SCRIPT_NAME     $fastcgi_script_name;
                fastcgi_param DOCUMENT_ROOT   /opt/preview/web;
                fastcgi_param SCRIPT_URL      $request_path;
                fastcgi_param SCRIPT_URI      $scheme://$http_host$request_path;
                fastcgi_param PATH_INFO       $path_info;
                fastcgi_param HTTP_AUTHORIZATION $http_authorization;
                fastcgi_param HTTP_HOST           $http_host;
                fastcgi_param SERVER_NAME         $host;
                fastcgi_param SERVER_PORT         $request_port;
                fastcgi_param APPLICATION_ENV     $view_app_env;
                fastcgi_param REDIRECT_URL $request_path;
                fastcgi_pass phpfpm;
                fastcgi_keep_conn on;
            }
            error_page 404 /common/blankpage/404.php;
            # static extension requested but file missing -> 404 (not Laravel)
            location ~* ^/sharp/.+\.(gif|jpg|png|css|js)$ {
                try_files $uri =404;
            }
            expires $view_expires;
            try_files $uri $uri/ /vivid/index.php?$query_string;
        }
        location ^~ /nimod/public/ {
