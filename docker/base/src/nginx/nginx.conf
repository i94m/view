            location ~* ^/servicesales/public/.+\.(gif|jpg|png|css|js)$ {
                try_files $uri =404;
            }
            expires $view_expires;
            try_files $uri $uri/ /vivid/index.php?$query_string;
        }
        # -------------------------------------------------------------
        # Everything else: plain PHP scripts, static files and PATH_INFO
        # (web/common/report.php/<file>, clientdocument_download.php/<file>).
        # `\.php($|/)` — NOT `\.php$` — is what makes PATH_INFO work.
        # -------------------------------------------------------------
        location ~ \.php($|/) {
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            set $path_info $fastcgi_path_info;
            # only execute scripts that really exist, otherwise 404
            try_files $fastcgi_script_name =404;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME     $fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   /opt/preview/web;
            fastcgi_param SCRIPT_URL      $request_path;
            fastcgi_param SCRIPT_URI      $scheme://$http_host$request_path;
            fastcgi_param PATH_INFO       $path_info;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            # Debian's fastcgi_params sends $host (drops the port); Apache
            # forwards the raw Host header.
            fastcgi_param HTTP_HOST           $http_host;
            fastcgi_param SERVER_NAME         $host;
            fastcgi_param SERVER_PORT         $request_port;
            fastcgi_param APPLICATION_ENV     $view_app_env;
            fastcgi_pass phpfpm;
            fastcgi_keep_conn on;
            # Apache sets APPLICATION_ENV for these trees via .htaccess only;
            # nginx sends an empty value elsewhere (see map above).
        }
        # Root .htaccess has no rules, but Apache still refuses dotfiles and
        # executes only *.php; a request to a directory without index gives
        # 403 (no autoindex) — nginx default is the same.
        location / {
            try_files $uri $uri/ =404;
            expires $view_expires;
        }
    }
}
