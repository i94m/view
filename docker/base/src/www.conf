; Start a new pool named 'www'.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
;listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
;listen.mode = 0660
; 突发连接排队长度（默认 511）
listen.backlog = 1024
pm = dynamic
; 本地开发容器，指标按"够用且不容易撞墙"配：
; 一个页面占住 child 0.6-4 秒（时间基本花在等远端 MySQL，不占 CPU），
; 15 个 child 足够「多标签 + 几个 agent 并发」；再大只会和 Docker VM 抢内存。
pm.max_children = 15
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 8
; 老代码有长生命周期对象/内存泄漏，跑够一批就回收，避免越跑越胖。
; （2000 而不是 500：减少"跑到阈值被回收"带来的偶发卡顿）
pm.max_requests = 2000
; 真正的"墙上时间"上限：PHP 的 max_execution_time 只计 CPU 时间，
; 卡在数据库/外部接口上的请求要由 FPM 回收。给到 15 分钟（对齐 nginx 900s）。
request_terminate_timeout = 900s
; 慢请求栈（超过 10 秒就记一份，排查"哪个页面卡在哪个函数"）
request_slowlog_timeout = 10s
slowlog = /var/log/php/fpm-slow.log
clear_env = no
